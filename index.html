<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube 2</title>
<link rel="icon" href="logo.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #0f0f0f; color: #f1f1f1; }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px; height: 60px; background: #0f0f0f;
    position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #272727;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; cursor: pointer; }
  .brand img { width: 34px; height: 34px; border-radius: 8px; }
  .brand .two { color: #ff2d2d; }
  .search { flex: 1; display: flex; justify-content: center; }
  .search input {
    width: 45%; max-width: 500px; padding: 10px 16px; font-size: 15px;
    background: #121212; border: 1px solid #303030; border-radius: 20px 0 0 20px;
    color: #f1f1f1; outline: none;
  }
  .search button {
    padding: 10px 20px; background: #222; border: 1px solid #303030; border-left: none;
    border-radius: 0 20px 20px 0; color: #f1f1f1; cursor: pointer; font-size: 15px;
  }
  .post-btn {
    background: #ff2d2d; color: #fff; border: none; border-radius: 20px;
    padding: 10px 20px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  .post-btn:hover { background: #e02424; }
  .layout { display: flex; }
  aside {
    width: 220px; min-width: 220px; padding: 16px 8px;
    border-right: 1px solid #272727; height: calc(100vh - 60px);
    position: sticky; top: 60px;
  }
  aside .nav-item {
    padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 15px;
  }
  aside .nav-item:hover, aside .nav-item.active { background: #272727; }
  main { flex: 1; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px 16px; }
  .card { cursor: pointer; }
  .thumb { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; background: #1f1f1f; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card h3 { font-size: 15px; margin: 10px 0 4px; line-height: 1.35; }
  .card p { font-size: 13px; color: #aaa; }
  .empty { text-align: center; color: #aaa; margin-top: 60px; font-size: 17px; }
  /* modal */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75);
    z-index: 200; align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #1c1c1c; border-radius: 16px; padding: 28px; width: 420px; max-width: 92vw;
    border: 1px solid #333;
  }
  .modal h2 { margin-bottom: 18px; font-size: 20px; }
  .modal label { display: block; font-size: 13px; color: #aaa; margin: 12px 0 6px; }
  .modal input, .modal textarea {
    width: 100%; padding: 10px 12px; background: #0f0f0f; border: 1px solid #333;
    border-radius: 8px; color: #f1f1f1; font-size: 14px; font-family: inherit;
  }
  .modal textarea { resize: vertical; min-height: 70px; }
  .modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .modal .row button { padding: 10px 20px; border-radius: 20px; border: none; cursor: pointer; font-size: 14px; }
  .cancel { background: #333; color: #f1f1f1; }
  .submit { background: #ff2d2d; color: #fff; font-weight: bold; }
  /* player */
  .player-modal { width: 860px; max-width: 94vw; }
  .player-modal video { width: 100%; border-radius: 12px; background: #000; max-height: 70vh; }
  .player-modal h2 { margin: 14px 0 6px; }
  .player-modal p { color: #aaa; font-size: 14px; }
  @media (max-width: 700px) {
    aside { display: none; }
    .search input { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="location.reload()">
    <img src="logo.png" alt="YouTube 2">
    <span>YouTube <span class="two">2</span></span>
  </div>
  <div class="search">
    <input id="searchInput" type="text" placeholder="Search" oninput="renderVideos()">
    <button onclick="renderVideos()">🔍</button>
  </div>
  <button class="post-btn" onclick="openPost()">＋ Post</button>
</header>

<div class="layout">
  <aside>
    <div class="nav-item active">🏠 Home</div>
    <div class="nav-item">🔥 Trending</div>
    <div class="nav-item">📺 Subscriptions</div>
    <div class="nav-item">📚 Library</div>
  </aside>
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">No videos found. Be the first to post! 🎬</div>
  </main>
</div>

<!-- Post modal -->
<div class="overlay" id="postOverlay">
  <div class="modal">
    <h2>📤 Post a video</h2>
    <label>Title</label>
    <input id="vTitle" type="text" placeholder="My awesome video" maxlength="100">
    <label>Description</label>
    <textarea id="vDesc" placeholder="What's it about?" maxlength="500"></textarea>
    <label>Video URL (direct mp4 link)</label>
    <input id="vUrl" type="url" placeholder="https://example.com/video.mp4">
    <label>Thumbnail URL (optional)</label>
    <input id="vThumb" type="url" placeholder="https://example.com/thumb.jpg">
    <div class="row">
      <button class="cancel" onclick="closePost()">Cancel</button>
      <button class="submit" onclick="submitPost()">Post</button>
    </div>
  </div>
</div>

<!-- Player modal -->
<div class="overlay" id="playerOverlay" onclick="if(event.target===this)closePlayer()">
  <div class="modal player-modal">
    <video id="player" controls></video>
    <h2 id="pTitle"></h2>
    <p id="pDesc"></p>
    <div class="row"><button class="cancel" onclick="closePlayer()">Close</button></div>
  </div>
</div>

<script>
  const SAMPLES = [
    { title: "Big Buck Bunny", desc: "A giant rabbit takes revenge on three bullying rodents in this classic open-source short film.",
      url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
      thumb: "https://picsum.photos/seed/bunny2/640/360" },
    { title: "Sintel", desc: "A lonely young woman searches for the dragon she once befriended.",
      url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
      thumb: "https://picsum.photos/seed/sintel2/640/360" },
    { title: "Tears of Steel", desc: "Sci-fi short film set in a future Amsterdam, blending live action and CGI.",
      url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
      thumb: "https://picsum.photos/seed/steel2/640/360" }
  ];

  function getVideos() {
    try { return JSON.parse(localStorage.getItem('yt2_videos')) || null; }
    catch { return null; }
  }
  function saveVideos(v) { localStorage.setItem('yt2_videos', JSON.stringify(v)); }
  if (!getVideos()) saveVideos(SAMPLES);

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderVideos() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const videos = getVideos() || [];
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    let shown = 0;
    videos.forEach((v, i) => {
      if (q && !(v.title.toLowerCase().includes(q) || (v.desc||'').toLowerCase().includes(q))) return;
      shown++;
      const thumb = v.thumb || ('https://picsum.photos/seed/yt2' + i + '/640/360');
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="thumb"><img src="${esc(thumb)}" alt="" loading="lazy"></div>
        <h3>${esc(v.title)}</h3><p>${esc(v.desc || '')}</p>`;
      card.onclick = () => playVideo(v);
      grid.appendChild(card);
    });
    document.getElementById('empty').style.display = shown ? 'none' : 'block';
  }

  function openPost() { document.getElementById('postOverlay').classList.add('open'); }
  function closePost() {
    document.getElementById('postOverlay').classList.remove('open');
    ['vTitle','vDesc','vUrl','vThumb'].forEach(id => document.getElementById(id).value = '');
  }

  function submitPost() {
    const title = document.getElementById('vTitle').value.trim();
    const url = document.getElementById('vUrl').value.trim();
    if (!title) { alert('Give your video a title!'); return; }
    if (!url) { alert('Add a video URL (direct mp4 link).'); return; }
    const videos = getVideos() || [];
    videos.unshift({
      title,
      desc: document.getElementById('vDesc').value.trim(),
      url,
      thumb: document.getElementById('vThumb').value.trim()
    });
    saveVideos(videos);
    closePost();
    renderVideos();
  }

  function playVideo(v) {
    const p = document.getElementById('player');
    p.src = v.url;
    document.getElementById('pTitle').textContent = v.title;
    document.getElementById('pDesc').textContent = v.desc || '';
    document.getElementById('playerOverlay').classList.add('open');
    p.play().catch(() => {});
  }
  function closePlayer() {
    const p = document.getElementById('player');
    p.pause(); p.removeAttribute('src'); p.load();
    document.getElementById('playerOverlay').classList.remove('open');
  }

  document.querySelectorAll('aside .nav-item').forEach(el =>
    el.addEventListener('click', () => {
      document.querySelectorAll('aside .nav-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
    }));

  renderVideos();
</script>
</body>
</html>
